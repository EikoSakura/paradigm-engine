<!--
BOND RANKS, mockup
Project: Anime, Foundry V14 system

TARGET
- system.bonds rows become a name and a Rank, E to S, stored as an index like
  every other Rank. The number and the sentence both go. Cap 6 held stays; new
  Bonds arrive at E and a created character starts with one Bond at E.
- Character sheet, Bonds panel: one row per Bond, the diamond Rank badge and
  the name. View mode badge click flips letter and die; edit mode swaps the
  badge for a Rank select E to S, with name, delete, and + New Bond until the
  sixth.
- Creator, Bond step: one Bond, locked at Rank E, name only. The number
  stepper and the sentence are gone.
- Migration: stored Bond numbers 1 to 6 map onto E to S, 6 is S, and the
  number and sentence fields are deleted.
- Invoke at the table: roll the Bond's Rank die and replace one of your Luck
  Dice with the result, or activate a Sync. Rules only, no system piece. Bond
  Ranks have no growth channel yet; the field is hand-edited, no automation.

INTERACTIONS
- View/Edit toggle flips the panel, matching the real sheet's title bar mode
  toggle. Badges flip letter and die on click.
- Edit mode: Rank select, name, delete, + New Bond until the sixth.
- Creator badge flips E and d4. Nothing else moves; the Rank is locked.

DESIGN NOTES
- Tokens: ink #221a36, paper #f7f2e7, paper-2 #ece4d1, beni #d92b48,
  gold #d9a13b, Rank colors rk-e..rk-s from the sheet.
- Fonts: Shippori Mincho B1 display, Zen Kaku Gothic New UI. No Japanese text.
- The diamond badge is the sheet's Trait/Technique Rank badge, reused so Bonds
  speak the same Rank language.
- Shared chrome as the other mockups: title bar, obi with beni spine, panels
  with hard offset shadows, screentone corners.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project: Anime, Bond Ranks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#221a36; --paper:#f7f2e7; --paper2:#ece4d1; --beni:#d92b48; --gold:#d9a13b;
  --rk-e:#8a8fa0; --rk-d:#3ba55d; --rk-c:#3c78d8; --rk-b:#7d5cd6; --rk-a:#e2632e; --rk-s:#d9a13b;
  --disp:'Shippori Mincho B1',serif; --ui:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--paper2); font-family:var(--ui); color:var(--ink);
  padding:28px 16px 48px;
}
.app{
  max-width:880px; margin:0 auto; background:var(--paper);
  border:2px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
}
button{font-family:var(--ui); cursor:pointer;}
button:focus-visible{outline:2px solid var(--beni); outline-offset:2px;}
input:focus-visible, select:focus-visible{outline:2px solid var(--beni); outline-offset:1px;}

/* ---------- title bar / obi ---------- */
.titlebar{
  background:var(--ink); color:var(--paper);
  display:flex; align-items:center; gap:12px; padding:0 14px; height:42px;
}
.dots{display:flex; gap:6px;}
.dots span{width:10px; height:10px; border-radius:50%;}
.dots span:nth-child(1){background:var(--beni);}
.dots span:nth-child(2){background:var(--gold);}
.dots span:nth-child(3){background:var(--paper);}
.titlebar .brand{font-weight:900; font-size:12px; letter-spacing:.22em; text-transform:uppercase;}
.titlebar .sheetname{
  margin-left:auto; font-weight:700; font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; opacity:.85;
}
.obi{
  position:relative; background:var(--ink); color:var(--paper);
  padding:20px 24px 22px 34px; overflow:hidden;
}
.obi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--beni);}
.obi::after{content:""; position:absolute; left:10px; top:0; bottom:0; width:1px; background:var(--paper);}
.obi .tone{
  position:absolute; right:-20px; top:-20px; width:240px; height:140px;
  background-image:radial-gradient(rgba(247,242,231,.28) 1.6px, transparent 1.6px);
  background-size:11px 11px; transform:rotate(-8deg); pointer-events:none;
}
.obi .eyebrow{
  font-size:10px; font-weight:900; letter-spacing:.3em; text-transform:uppercase;
  color:var(--gold); margin-bottom:6px;
}
.obi h1{font-family:var(--disp); font-weight:800; font-size:34px; line-height:1.05; letter-spacing:.02em;}

/* ---------- stage & panels ---------- */
.stage{padding:24px; display:flex; flex-direction:column; gap:26px;}
.panel{border:2px solid var(--ink); background:var(--paper); box-shadow:5px 5px 0 var(--ink);}
.panel-head{
  position:relative; background:var(--ink); color:var(--paper);
  padding:8px 14px; font-weight:900; font-size:12px; letter-spacing:.2em;
  text-transform:uppercase; overflow:hidden;
}
.panel-head::after{
  content:""; position:absolute; right:-8px; top:-8px; width:90px; height:44px;
  background-image:radial-gradient(rgba(247,242,231,.3) 1.3px, transparent 1.3px);
  background-size:8px 8px; transform:rotate(-8deg);
}
.panel-head .side{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:10px; letter-spacing:.14em; color:var(--gold); z-index:1;
}
.panel-body{padding:18px;}
label{
  display:block; font-size:10px; font-weight:900; letter-spacing:.2em;
  text-transform:uppercase; margin-bottom:5px;
}

/* ---------- mode toggle ---------- */
.seg{display:flex; border:2px solid var(--ink); width:max-content; margin-bottom:16px;}
.seg button{
  background:var(--paper); border:none; padding:6px 12px; font-size:10px;
  font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--ink);
}
.seg button.on{background:var(--ink); color:var(--paper);}

/* ---------- rank badge ---------- */
.badge{position:relative; width:34px; height:34px; flex:none; border:none; background:none; padding:0;}
.badge .dia{
  position:absolute; inset:3px; transform:rotate(45deg);
  border:2px solid var(--ink); background:var(--rkc, var(--rk-e));
}
.badge .r{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--disp); font-weight:800; font-size:17px; color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.35);
}
.badge .r.alt{font-size:12px;}
.badge.big{width:44px; height:44px;}
.badge.big .r{font-size:22px;}
.badge.big .r.alt{font-size:13px;}

/* ---------- bond rows ---------- */
.rows{display:flex; flex-direction:column; gap:12px; max-width:520px;}
.bondrow{
  display:flex; align-items:center; gap:10px;
  border:2px solid var(--ink); background:var(--paper);
  box-shadow:3px 3px 0 var(--ink); padding:8px 12px;
}
.bondrow .ttl{font-size:14px; font-weight:800;}
.kindsel{
  border:2px solid var(--ink); background:var(--paper); font-family:var(--disp);
  font-weight:800; font-size:15px; padding:4px 6px; color:var(--ink);
}
.ed-name{
  flex:1; min-width:0; border:2px solid var(--ink); background:var(--paper);
  font-family:var(--ui); font-weight:700; font-size:13px; padding:6px 8px;
}
.delbtn{
  width:26px; height:26px; flex:none; border:2px solid var(--ink); background:var(--paper);
  color:var(--beni); font-weight:900; font-size:12px; line-height:1; padding:0;
}
.addbtn{
  width:max-content; border:2px dashed var(--ink); background:none; padding:8px 14px;
  font-weight:900; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink);
}

/* ---------- creator bond ---------- */
.creator-card{max-width:520px; display:flex; gap:12px; align-items:flex-end;}
.field{flex:1;}
.field input{
  width:100%; border:2px solid var(--ink); background:var(--paper);
  font-family:var(--ui); font-size:13px; font-weight:500; padding:8px 10px;
}

@media (max-width:640px){
  .obi h1{font-size:26px;}
}
</style>
</head>
<body>
<div class="app">

  <div class="titlebar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="brand">Project: Anime</div>
    <div class="sheetname">Bond Ranks</div>
  </div>

  <div class="obi">
    <div class="tone"></div>
    <div class="eyebrow">Mockup</div>
    <h1>Bond Ranks</h1>
  </div>

  <div class="stage">

    <!-- SHEET BONDS PANEL -->
    <div class="panel">
      <div class="panel-head">Character Sheet · Bonds<span class="side" id="bondTail">1 / 6</span></div>
      <div class="panel-body">
        <div class="seg" id="modeSeg">
          <button class="on" data-mode="view">View</button>
          <button data-mode="edit">Edit</button>
        </div>
        <div class="rows" id="bondRows"></div>
      </div>
    </div>

    <!-- CREATOR BOND STEP -->
    <div class="panel">
      <div class="panel-head">Creator · Bond<span class="side">One, Rank E</span></div>
      <div class="panel-body">
        <div class="creator-card">
          <button type="button" class="badge big" id="cBadge" aria-label="Rank"></button>
          <div class="field">
            <label for="cName">Name</label>
            <input type="text" id="cName" placeholder="Bond Name">
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
const LADDER = [
  {rank:"E", die:"d4",    css:"var(--rk-e)"},
  {rank:"D", die:"d6",    css:"var(--rk-d)"},
  {rank:"C", die:"d8",    css:"var(--rk-c)"},
  {rank:"B", die:"d10",   css:"var(--rk-b)"},
  {rank:"A", die:"d12",   css:"var(--rk-a)"},
  {rank:"S", die:"d12+1", css:"var(--rk-s)"}
];
const state = {
  editing:false,
  flips:new Set(),
  bonds:[{name:"", rank:0}]
};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const badge = (i, rank, flipped) => `
  <button type="button" class="badge" data-flip="${i}" aria-label="Rank">
    <span class="dia" style="--rkc:${LADDER[rank].css}"></span>
    <span class="r${flipped?" alt":""}">${flipped?LADDER[rank].die:LADDER[rank].rank}</span>
  </button>`;

/* ---------- sheet panel ---------- */
function render(){
  document.getElementById("bondTail").textContent = `${state.bonds.length} / 6`;
  const wrap = document.getElementById("bondRows");
  wrap.innerHTML = state.bonds.map((b,i)=>{
    if(state.editing) return `<div class="bondrow">
      <select class="kindsel" data-rank="${i}" aria-label="Bond Rank">
        ${LADDER.map((l,r)=>`<option value="${r}"${r===b.rank?" selected":""}>${l.rank}</option>`).join("")}
      </select>
      <input class="ed-name" data-name="${i}" value="${esc(b.name)}" placeholder="Bond Name">
      <button type="button" class="delbtn" data-del="${i}" aria-label="Remove">✕</button>
    </div>`;
    return `<div class="bondrow">
      ${badge(i, b.rank, state.flips.has(i))}
      <span class="ttl">${esc(b.name)}</span>
    </div>`;
  }).join("") + (state.editing && state.bonds.length < 6
    ? `<button type="button" class="addbtn" id="addBond">+ New Bond</button>` : "");
  bind(wrap);
}
function bind(wrap){
  wrap.querySelectorAll("[data-flip]").forEach(el=>el.addEventListener("click",()=>{
    const i = Number(el.dataset.flip);
    state.flips.has(i) ? state.flips.delete(i) : state.flips.add(i);
    render();
  }));
  wrap.querySelectorAll("[data-rank]").forEach(el=>el.addEventListener("change",()=>{
    state.bonds[Number(el.dataset.rank)].rank = Number(el.value);
  }));
  wrap.querySelectorAll("[data-name]").forEach(el=>el.addEventListener("input",()=>{
    state.bonds[Number(el.dataset.name)].name = el.value;
  }));
  wrap.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{
    state.bonds.splice(Number(el.dataset.del), 1);
    state.flips.clear();
    render();
  }));
  const add = wrap.querySelector("#addBond");
  if(add) add.addEventListener("click",()=>{
    state.bonds.push({name:"", rank:0});
    render();
  });
}
document.getElementById("modeSeg").querySelectorAll("button").forEach(b=>{
  b.addEventListener("click",()=>{
    state.editing = b.dataset.mode === "edit";
    document.getElementById("modeSeg").querySelectorAll("button")
      .forEach(x=>x.classList.toggle("on", x===b));
    render();
  });
});

/* ---------- creator step ---------- */
let cFlip = false;
const cBadge = document.getElementById("cBadge");
function renderCreator(){
  cBadge.innerHTML = `<span class="dia" style="--rkc:${LADDER[0].css}"></span>
    <span class="r${cFlip?" alt":""}">${cFlip?LADDER[0].die:LADDER[0].rank}</span>`;
}
cBadge.addEventListener("click",()=>{ cFlip = !cFlip; renderCreator(); });

render(); renderCreator();
</script>
</body>
</html>
